<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPR Management System</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="mark">EPR</div><span>EPR System</span></div>
    <nav id="navList"></nav>
    <div class="sidebar-footer">
      <div class="who">
        <div class="avatar" id="avatarInitial">?</div>
        <div class="meta">
          <div class="name" id="whoName">Loading…</div>
          <div class="role" id="whoRole">—</div>
        </div>
      </div>
      <button class="nav-item" id="logoutBtn">↩ Sign out</button>
    </div>
  </aside>
  <main class="main" id="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">Loading…</h1>
        <div class="crumb" id="pageCrumb"></div>
      </div>
      <div id="pageActions"></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<!-- Record add/edit modal (department/presbytery activity records) -->
<div class="modal-backdrop" id="recordModalBackdrop">
  <div class="modal">
    <h3 id="recordModalTitle">Add record</h3>
    <div class="error-msg" id="recordError"></div>
    <form id="recordForm">
      <div class="field" id="categoryField">
        <label for="recCategory">Category</label>
        <select id="recCategory"></select>
      </div>
      <div class="field">
        <label for="recTitle">Title</label>
        <input type="text" id="recTitle" required placeholder="e.g. Youth camp — Q3">
      </div>
      <div class="field">
        <label for="recDescription">Description / notes</label>
        <textarea id="recDescription" rows="3" placeholder="Optional details"></textarea>
      </div>
      <div class="field">
        <label for="recStatus">Status</label>
        <select id="recStatus">
          <option>Planned</option>
          <option>Ongoing</option>
          <option>Completed</option>
        </select>
      </div>
      <div class="field">
        <label for="recDate">Date</label>
        <input type="date" id="recDate">
      </div>
      <div class="actions">
        <button type="button" class="btn btn-ghost" id="recordCancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="recordSaveBtn" style="width:auto;">Save record</button>
      </div>
    </form>
  </div>
</div>

<!-- Staff add/edit modal -->
<div class="modal-backdrop" id="userModalBackdrop">
  <div class="modal">
    <h3 id="userModalTitle">Add staff account</h3>
    <div class="error-msg" id="userError"></div>
    <form id="userForm">
      <div class="field">
        <label for="uName">Full name</label>
        <input type="text" id="uName" required placeholder="e.g. Jean Mukiza">
      </div>
      <div class="field" id="uEmailField">
        <label for="uEmail">Email</label>
        <input type="email" id="uEmail" required placeholder="name@epr.rw">
      </div>
      <div class="field" id="uPasswordField">
        <label for="uPassword">Temporary password</label>
        <input type="text" id="uPassword" placeholder="At least 6 characters">
      </div>
      <div class="field">
        <label for="uRole">Access level</label>
        <select id="uRole">
          <option value="staff">Department / Presbytery staff</option>
          <option value="superadmin">EPR Super Admin (full access)</option>
        </select>
      </div>
      <div class="field" id="uScopeField">
        <label for="uScope">Assigned department / presbytery</label>
        <select id="uScope"></select>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-ghost" id="userCancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="userSaveBtn" style="width:auto;">Save account</button>
      </div>
    </form>
  </div>
</div>

<!-- Chart of Accounts add/edit modal -->
<div class="modal-backdrop" id="accountModalBackdrop">
  <div class="modal">
    <h3 id="accountModalTitle">Add account</h3>
    <div class="error-msg" id="accountError"></div>
    <form id="accountForm">
      <div class="field">
        <label for="acctCode">Account code</label>
        <input type="text" id="acctCode" required placeholder="e.g. 1000">
      </div>
      <div class="field">
        <label for="acctName">Account name</label>
        <input type="text" id="acctName" required placeholder="e.g. Cash at bank">
      </div>
      <div class="field">
        <label for="acctType">Type</label>
        <select id="acctType"></select>
      </div>
      <div class="field">
        <label for="acctDescription">Description</label>
        <textarea id="acctDescription" rows="3" placeholder="Optional details"></textarea>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-ghost" id="accountCancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="accountSaveBtn" style="width:auto;">Save account</button>
      </div>
    </form>
  </div>
</div>

<!-- Generic finance-module add/edit modal: reused by Record Expense, Record
     Income, Customers, Suppliers, Inventory, Projects, Make Budget. Its
     fields are built dynamically in js/app.js from js/structure.js. -->
<div class="modal-backdrop" id="moduleModalBackdrop">
  <div class="modal">
    <h3 id="moduleModalTitle">Add item</h3>
    <div class="error-msg" id="moduleError"></div>
    <form id="moduleForm">
      <div id="moduleFields"></div>
      <div class="actions">
        <button type="button" class="btn btn-ghost" id="moduleCancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="moduleSaveBtn" style="width:auto;">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Invoice / Bill add/edit modal: shared by both, with line items and a
     live-computed total. Labels swap based on which one is open. -->
<div class="modal-backdrop" id="docModalBackdrop">
  <div class="modal" style="max-width:640px;">
    <h3 id="docModalTitle">New invoice</h3>
    <div class="error-msg" id="docError"></div>
    <form id="docForm">
      <div class="field">
        <label id="docPartyLabel" for="docParty">Customer</label>
        <input type="text" id="docParty" required placeholder="Name">
      </div>
      <div class="field">
        <label id="docNumberLabel" for="docNumber">Number</label>
        <input type="text" id="docNumber" placeholder="e.g. INV-0001">
      </div>
      <div style="display:flex;gap:10px;">
        <div class="field" style="flex:1;">
          <label for="docDate">Date</label>
          <input type="date" id="docDate">
        </div>
        <div class="field" style="flex:1;">
          <label for="docDueDate">Due date</label>
          <input type="date" id="docDueDate">
        </div>
      </div>
      <div class="field">
        <label for="docStatus">Status</label>
        <select id="docStatus"></select>
      </div>

      <div class="field">
        <label>Line items</label>
        <div id="docItemsRows"></div>
        <button type="button" class="btn btn-ghost btn-sm" id="docAddItemBtn" style="width:auto;margin-top:4px;">+ Add line</button>
      </div>

      <div class="field" style="text-align:right;">
        <label>Total</label>
        <div id="docTotalDisplay" style="font-size:20px;font-weight:700;">0 RWF</div>
      </div>

      <div class="field">
        <label for="docNotes">Notes</label>
        <textarea id="docNotes" rows="2" placeholder="Optional details"></textarea>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-ghost" id="docCancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="docSaveBtn" style="width:auto;">Save</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
