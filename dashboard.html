<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPR Management System</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  /* --- Additions to support Chart of Accounts / tables / modals ---
     Move these into css/styles.css whenever convenient; they're inlined
     here so the new feature works even before you touch your stylesheet. */
  .modal-backdrop{display:none;}
  .modal-backdrop.open{display:flex;align-items:center;justify-content:center;}
  .nav-item.active{font-weight:600;background:rgba(29,143,225,0.12);}
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;}
  .card{border:1px solid #e5e7eb;border-radius:10px;padding:16px;}
  .card h3{margin:0 0 8px;font-size:13px;color:#6b7280;font-weight:600;text-transform:uppercase;}
  .card p{margin:0;font-size:28px;font-weight:700;}
  .data-table{width:100%;border-collapse:collapse;margin-top:12px;}
  .data-table th,.data-table td{text-align:left;padding:10px 12px;border-bottom:1px solid #eef0f2;font-size:14px;}
  .badge{background:#eef2ff;color:#1D8FE1;padding:2px 8px;border-radius:999px;font-size:12px;}
  .btn-icon{border:none;background:none;cursor:pointer;font-size:15px;padding:4px 6px;}
  .muted{color:#9ca3af;font-size:12px;}
  .field{margin-bottom:12px;}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="mark">EPR</div><span>EPR System</span></div>
    <nav id="navList"></nav>
    <div class="sidebar-footer">
      <div class="who">
        <div class="avatar" id="avatarInitial">?</div>
        <div class="meta">
          <div class="name" id="whoName">Loading…</div>
          <div class="role" id="whoRole">—</div>
        </div>
      </div>
      <button class="nav-item" id="logoutBtn">↩ Sign out</button>
    </div>
  </aside>
  <main class="main" id="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">Loading…</h1>
        <div class="crumb" id="pageCrumb"></div>
      </div>
      <div id="pageActions"></div>
    </div>
    <div id="content"></div>
  </main>
</div>

<!-- Record add/edit modal (Departments & Presbyteries activity records) -->
<div class="modal-backdrop" id="recordModalBackdrop">
  <div class="modal">
    <h3 id="recordModalTitle">Add record</h3>
    <div class="error-msg" id="recordError"></div>
    <form id="recordForm">
      <div class="field" id="categoryField">
        <label for="recCategory">Category</label>
        <select id="recCategory"></select>
      </div>
      <div class="field">
        <label for="recTitle">Title</label>
        <input type="text" id="recTitle" required placeholder="e.g. Youth camp — Q3">
      </div>
      <div class="field">
        <label for="recDescription">Description / notes</label>
        <textarea id="recDescription" rows="3" placeholder="Optional details"></textarea>
      </div>
      <div class="field">
        <label for="recStatus">Status</label>
        <select id="recStatus">
          <option>Planned</option>
          <option>Ongoing</option>
          <option>Completed</option>
        </select>
      </div>
      <div class="field">
        <label for="recDate">Date</label>
        <input type="date" id="recDate">
      </div>
      <div class="actions">
        <button type="button" class="btn btn-ghost" id="recordCancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="recordSaveBtn" style="width:auto;">Save record</button>
      </div>
    </form>
  </div>
</div>

<!-- Staff add/edit modal -->
<div class="modal-backdrop" id="userModalBackdrop">
  <div class="modal">
    <h3 id="userModalTitle">Add staff account</h3>
    <div class="error-msg" id="userError"></div>
    <form id="userForm">
      <div class="field">
        <label for="uName">Full name</label>
        <input type="text" id="uName" required placeholder="e.g. Jean Mukiza">
      </div>
      <div class="field" id="uEmailField">
        <label for="uEmail">Email</label>
        <input type="email" id="uEmail" required placeholder="name@epr.rw">
      </div>
      <div class="field" id="uPasswordField">
        <label for="uPassword">Temporary password</label>
        <input type="text" id="uPassword" placeholder="At least 6 characters">
      </div>
      <div class="field">
        <label for="uRole">Access level</label>
        <select id="uRole">
          <option value="staff">Department / Presbytery staff</option>
          <option value="superadmin">EPR Super Admin (full access)</option>
        </select>
      </div>
      <div class="field" id="uScopeField">
        <label for="uScope">Assigned department / presbytery</label>
        <select id="uScope"></select>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-ghost" id="userCancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="userSaveBtn" style="width:auto;">Save account</button>
      </div>
    </form>
  </div>
</div>

<!-- Chart of Accounts add/edit modal -->
<div class="modal-backdrop" id="acctModalBackdrop">
  <div class="modal">
    <h3 id="acctModalTitle">Add account</h3>
    <div class="error-msg" id="acctError"></div>
    <form id="acctForm">
      <div class="field">
        <label for="acctName">Account name</label>
        <input type="text" id="acctName" required placeholder="e.g. BK-EPR Presbytery Kigali">
      </div>
      <div class="field">
        <label for="acctType">Account type</label>
        <select id="acctType"></select>
      </div>
      <div class="field">
        <label for="acctScope">Scope</label>
        <select id="acctScope"></select>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-ghost" id="acctCancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="acctSaveBtn" style="width:auto;">Save account</button>
      </div>
    </form>
  </div>
</div>

<!-- Chart of Accounts bulk import modal (Super Admin only) -->
<div class="modal-backdrop" id="bulkImportModalBackdrop">
  <div class="modal">
    <h3>Bulk import accounts</h3>
    <div class="error-msg" id="bulkImportError"></div>
    <form id="bulkImportForm">
      <div class="field">
        <label for="bulkImportScope">Import into scope</label>
        <select id="bulkImportScope"></select>
      </div>
      <div class="field">
        <label for="bulkImportText">Paste accounts (one per line: "Account name" then "Type" — exactly as exported from QuickBooks)</label>
        <textarea id="bulkImportText" rows="10" placeholder="BK-EPR Presbytery Kigali	Bank
Accounts receivable-Kigali	Accounts Receivable"></textarea>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-ghost" id="bulkImportCancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="bulkImportSubmitBtn" style="width:auto;">Import accounts</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
