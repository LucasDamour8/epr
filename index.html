<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPR Management System — Sign in</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-crest">EPR</div>
    <h1>Sign in</h1>
    <p class="sub">EPR Management System — staff and admin access</p>

    <div class="error-msg" id="loginError"></div>

    <form id="loginForm">
      <div class="field">
        <label for="lEmail">Email</label>
        <input type="email" id="lEmail" required placeholder="name@epr.rw" autocomplete="username">
      </div>
      <div class="field">
        <label for="lPassword">Password</label>
        <input type="password" id="lPassword" required placeholder="Your password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">Sign in</button>
    </form>

    <p class="hint">Don't have an account? Ask your EPR Super Admin to create one for you.</p>
  </div>
</div>

<script type="module">
  import { auth, onAuthStateChanged, signInWithEmailAndPassword } from "./js/firebase-config.js";

  const $ = (id) => document.getElementById(id);

  // Already signed in? Skip straight to the dashboard.
  onAuthStateChanged(auth, (user) => {
    if (user) window.location.href = "dashboard.html";
  });

  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("loginError").style.display = "none";
    const btn = $("loginBtn");
    btn.disabled = true;
    btn.textContent = "Signing in…";

    const email = $("lEmail").value.trim();
    const password = $("lPassword").value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = "dashboard.html";
    } catch (err) {
      const map = {
        "auth/invalid-email": "Enter a valid email address.",
        "auth/invalid-credential": "Incorrect email or password.",
        "auth/user-not-found": "No account found for that email.",
        "auth/wrong-password": "Incorrect email or password.",
        "auth/too-many-requests": "Too many attempts. Try again in a moment."
      };
      $("loginError").textContent = map[err.code] || err.message;
      $("loginError").style.display = "block";
    } finally {
      btn.disabled = false;
      btn.textContent = "Sign in";
    }
  });
</script>
</body>
</html>
